[env]
_.file = {
  # ~/.config/afastchat.com/.env
  path = "{{env.HOME}}/.config/afastchat.com/.env",
}
OPENROUTER_TOKEN_KEY = { required = true }
GOOGLE_CLIENT_ID = { required = true }
GOOGLE_CLIENT_SECRET = { required = true }
R2_ENDPOINT = { required = true }
R2_ACCESS_KEY_ID = { required = true }
R2_SECRET_ACCESS_KEY = { required = true }
R2_BUCKET = { required = true }

[tools]
go = "1.27.1"
watchexec = "latest"

[tasks.templ-generate]
run = "templ generate"

[tasks.scc]
description = "Count project source lines, excluding generated templ files"
dir = "{{ config_root }}"
run = 'scc --count-as templ:html --not-match "_templ\.go$" .'

[tasks.default]
run = "mise run --output=prefix dev:go ::: dev:css ::: dev:js"

[tasks."dev:go"]
run = "exec watchexec -r -e go -e templ -e sql -- templ generate '&&' go run ./cmd/server"

[tasks."dev:css"]
run = "bunx @tailwindcss/cli -i ./views/styles.css -o ./public/styles.css --watch=always"

[tasks."dev:js"]
run = """
bunx esbuild ./views/scripts/index.ts \
  --bundle \
  --format=esm \
  '--external:/public/*' \
  --minify \
  --target=es2022 \
  --sourcemap \
  --outdir=./public \
  --watch=forever
"""

[tasks.build-assets]
run = [
  "bunx @tailwindcss/cli -i ./views/styles.css -o ./public/styles.css --minify",
  "bunx esbuild ./views/scripts/index.ts --bundle --format=esm '--external:/public/*' --minify --target=es2022 --outdir=./public",
]

[tasks.build]
depends = ["build-assets", "templ-generate"]
run = "go build -o ./bin/server ./cmd/server"

[tasks."db:migrate"]
description = "Generate a goose migration by diffing db/schema.sql against existing migrations"
usage = 'arg "<name>"'
run = "atlas migrate diff \"$usage_name\" --env local"

[tasks.connect]
run = "exec sqlite3 tmp/app.db"

[tasks."db:sql"]
usage = 'arg "<sql>"'
run = "exec sqlite3 -bail tmp/app.db \"$usage_sql\""

[tasks.format]
run = [
  "templ fmt .",
  "go fmt ./...",
  "bunx prettier --write 'views/**/*.ts' views/styles.css",
]

[tasks."lint:golangci"]
run = "golangci-lint run ./..."

[tasks."lint:sumtype"]
run = "go run github.com/alecthomas/go-check-sumtype/cmd/go-check-sumtype@v0.5.0 ./..."

[tasks.lint]
# sumtype must examine all packages at once, so must be run independently
depends = ["lint:golangci", "lint:sumtype", "lint:styles"]

[tasks.test]
run = "go test ./..."

[tasks.bench]
description = "Black-box streaming load benchmark against a fake OpenRouter. Extra args go to go test, e.g. -bench.users=100,500"
run = "go test ./bench -run '^$' -bench Streaming"

[tasks."bench:profile"]
description = "Run the streaming benchmark with CPU, block, mutex, heap and trace profiles in tmp/bench, then print where app code spends CPU and blocks"
run = "mkdir -p tmp/bench && go test ./bench -run '^$' -bench Streaming -o tmp/bench/bench.test -cpuprofile tmp/bench/cpu.out -blockprofile tmp/bench/block.out -mutexprofile tmp/bench/mutex.out -memprofile tmp/bench/mem.out -trace tmp/bench/trace.out"
depends_post = ["bench:report"]

[tasks."bench:report"]
description = "Summarize the profiles from bench:profile, filtered to app code"
run = [
  "go tool pprof -top -cum -nodecount=30 -show 'afastchat\\.com/(server|db|agents|views)' tmp/bench/bench.test tmp/bench/cpu.out",
  "go tool pprof -top -cum -nodecount=20 -show 'afastchat\\.com/(server|db|agents|views)' -hide 'handleThreadEvents$' tmp/bench/bench.test tmp/bench/block.out",
]

[tasks.tscheck]
run = "bunx tsc --noEmit"
